apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: instrumentations.rio.otelx.github.io
spec:
  group: rio.otelx.github.io
  scope: Cluster
  names:
    plural: instrumentations
    singular: instrumentation
    kind: Instrumentation
    shortNames: [rioinstr]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Generation
          type: integer
          jsonPath: .status.observedGeneration
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          x-kubernetes-validations:
            - rule: "self.metadata.name == 'cluster'"
              message: The singleton Instrumentation must be named cluster.
          properties:
            apiVersion: {type: string}
            kind: {type: string}
            metadata: {type: object}
            spec:
              type: object
              required: [image, endpoint, signals, rules]
              properties:
                image: {type: string, minLength: 1}
                endpoint: {type: string, pattern: '^https?://[^/]+.*$'}
                timeoutSeconds: {type: integer, minimum: 10, maximum: 3600, default: 300}
                retryToken: {type: string, maxLength: 64}
                signals:
                  type: object
                  required: [traces, metrics, logs]
                  properties:
                    traces: {type: boolean}
                    metrics: {type: boolean}
                    logs: {type: boolean}
                env: &env
                  type: array
                  maxItems: 100
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [name]
                  items:
                    type: object
                    required: [name]
                    x-kubernetes-validations:
                      - rule: "!(self.name in ['OTEL_TRACES_EXPORTER', 'OTEL_METRICS_EXPORTER', 'OTEL_LOGS_EXPORTER', 'OTEL_EXPORTER_OTLP_ENDPOINT', 'OTEL_EXPORTER_OTLP_PROTOCOL']) && !self.name.startsWith('OTEL_INJECTOR_')"
                        message: This variable is owned by the typed configuration.
                      - rule: "!(has(self.value) && has(self.valueFrom))"
                        message: Set either value or valueFrom.
                    properties:
                      name: {type: string, pattern: '^OTEL_[A-Z0-9_]+$', maxLength: 128}
                      value: {type: string, maxLength: 4096}
                      valueFrom:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                rules:
                  type: array
                  minItems: 1
                  maxItems: 100
                  x-kubernetes-list-type: atomic
                  items:
                    type: object
                    required: [name, selector, action]
                    properties:
                      name: {type: string, minLength: 1, maxLength: 63}
                      action: {type: string, enum: [Inject, Skip]}
                      selector:
                        type: object
                        required: [namespaces]
                        properties:
                          namespaces:
                            type: array
                            minItems: 1
                            items: {type: string, pattern: '^(\*|[a-z0-9]([-a-z0-9]*[a-z0-9])?)$', maxLength: 63}
                          workloads:
                            type: array
                            items:
                              type: object
                              required: [kind, name]
                              properties:
                                kind: {type: string, enum: [Deployment, StatefulSet, DaemonSet, Pod, ReplicaSet, Job, CronJob]}
                                name: {type: string, minLength: 1, maxLength: 253}
                      image: {type: string, minLength: 1}
                      endpoint: {type: string, pattern: '^https?://[^/]+.*$'}
                      signals:
                        type: object
                        properties:
                          traces: {type: boolean}
                          metrics: {type: boolean}
                          logs: {type: boolean}
                      env: *env
            status:
              type: object
              properties:
                phase: {type: string}
                message: {type: string}
                observedGeneration: {type: integer, format: int64}
                workloads:
                  type: array
                  items:
                    type: object
                    properties:
                      namespace: {type: string}
                      kind: {type: string}
                      name: {type: string}
                      phase: {type: string}
                      message: {type: string}
                      revision: {type: string}
                      failedRevision: {type: string}

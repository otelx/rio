name: Bug report
description: Report a reproducible problem with RIO.
body:
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include a minimal sanitized policy and steps. Never include credentials or kubeconfigs.
    validations:
      required: true
  - type: textarea
    id: versions
    attributes:
      label: Versions and environment
      description: RIO, Kubernetes, container runtime, application runtime, architecture, and delivery method.
    validations:
      required: true

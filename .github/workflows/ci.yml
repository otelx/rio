name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  quality:
    name: Go and source checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - run: make test vet build
      - name: Check source formatting and shell scripts
        run: |
          test -z "$(gofmt -l cmd internal)"
          shellcheck scripts/*.sh payload/scripts/*.sh payload/*.sh
          python3 -m py_compile payload/scripts/download.py payload/python/sitecustomize.py
          python3 -m json.tool payload/versions.json > /dev/null

  integration:
    name: Integration (${{ matrix.delivery }})
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - delivery: imageVolume
            image_volume: 'true'
          - delivery: initContainer
            image_volume: 'false'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Install kind
        env:
          GOBIN: ${{ github.workspace }}/.artifacts/bin
        run: |
          mkdir -p .artifacts/tmp
          export TMPDIR="$PWD/.artifacts/tmp"
          go install sigs.k8s.io/kind@v0.33.0
          echo "$GOBIN" >> "$GITHUB_PATH"
      - name: Build controller
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: ghcr.io/otelx/rio:dev
          platforms: linux/amd64
          cache-from: type=gha,scope=operator
          cache-to: type=gha,mode=max,scope=operator
      - name: Build payload
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: payload
          load: true
          tags: ghcr.io/otelx/rio-payload:dev
          platforms: linux/amd64
          cache-from: type=gha,scope=payload
          cache-to: type=gha,mode=max,scope=payload
      - name: Verify all five language loaders
        if: matrix.delivery == 'imageVolume'
        run: make smoke
      - name: Verify rollout, recovery, removal, and HTTP trace export
        env:
          CLUSTER_NAME: rio-ci-${{ matrix.delivery }}
          IMAGE_VOLUME_ENABLED: ${{ matrix.image_volume }}
          EXPECT_DELIVERY: ${{ matrix.delivery }}
        run: |
          export CLUSTER_NAME="${CLUSTER_NAME,,}"
          make e2e
      - name: Archive tested release images
        if: startsWith(github.ref, 'refs/tags/') && matrix.delivery == 'imageVolume'
        run: docker save ghcr.io/otelx/rio:dev ghcr.io/otelx/rio-payload:dev | gzip > .artifacts/release-images.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: startsWith(github.ref, 'refs/tags/') && matrix.delivery == 'imageVolume'
        with:
          name: tested-release-images
          path: .artifacts/release-images.tar.gz
          include-hidden-files: true
          retention-days: 3
      - name: Collect sanitized diagnostics
        if: always()
        run: |
          mkdir -p .artifacts/diagnostics
          find .artifacts/e2e -type f \( -name '*.log' -o -name '*.json' \) -exec cp {} .artifacts/diagnostics/ \; 2>/dev/null || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: diagnostics-${{ matrix.delivery }}
          path: .artifacts/diagnostics/
          include-hidden-files: true
          if-no-files-found: ignore

  release:
    name: Publish validated alpha release
    if: startsWith(github.ref, 'refs/tags/') && github.event_name == 'push'
    needs: [quality, integration]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: tested-release-images
          path: .artifacts/release
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested images and source
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/release.sh

name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 7 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  quality:
    name: Go and source checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - run: make test vet build
      - name: Scan controller source and verify security policy
        run: |
          scripts/install-security-tools.sh
          .artifacts/bin/govulncheck ./...
          python3 -m unittest discover -s scripts -p 'test_security.py'
      - name: Check source formatting and shell scripts
        run: |
          test -z "$(gofmt -l cmd internal)"
          shellcheck scripts/*.sh payload/scripts/*.sh payload/*.sh
          python3 -m py_compile payload/scripts/download.py payload/python/sitecustomize.py
          python3 -m json.tool payload/versions.json > /dev/null
      - name: Check release source policy
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'

  images:
    name: Build and load agents (${{ matrix.arch }})
    needs: quality
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 30
    env:
      OPERATOR_IMAGE: ghcr.io/otelx/rio/operator:dev-${{ matrix.arch }}
      PAYLOAD_IMAGE: ghcr.io/otelx/rio/instrumentation:dev-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Build operator image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: ${{ env.OPERATOR_IMAGE }}
          platforms: linux/${{ matrix.arch }}
          cache-from: type=gha,scope=operator-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=operator-${{ matrix.arch }}
      - name: Build instrumentation image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: payload
          load: true
          tags: ${{ env.PAYLOAD_IMAGE }}
          platforms: linux/${{ matrix.arch }}
          cache-from: type=gha,scope=payload-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=payload-${{ matrix.arch }}
      - name: Scan final images and controller binary
        run: |
          scripts/install-security-tools.sh
          status=0
          scripts/scan-image.sh operator "$OPERATOR_IMAGE" .artifacts/security/operator || status=1
          scripts/scan-image.sh instrumentation "$PAYLOAD_IMAGE" .artifacts/security/instrumentation || status=1
          exit "$status"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: security-current-${{ matrix.arch }}
          path: |
            .artifacts/security/**/*.json
            .artifacts/security/**/*.txt
          include-hidden-files: true
          retention-days: 30
      - name: Verify all five language loaders with glibc and musl
        run: make smoke
      - name: Archive tested images
        run: docker save "$OPERATOR_IMAGE" "$PAYLOAD_IMAGE" | gzip > .artifacts/release-images.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tested-release-images-${{ matrix.arch }}
          path: .artifacts/release-images.tar.gz
          include-hidden-files: true
          retention-days: 3
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: loaders-${{ matrix.arch }}
          path: .artifacts/image-smoke/**/*.log
          include-hidden-files: true
          if-no-files-found: ignore

  integration:
    name: Integration (${{ matrix.arch }}, ${{ matrix.delivery }})
    needs: images
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 30
    env:
      OPERATOR_IMAGE: ghcr.io/otelx/rio/operator:dev-${{ matrix.arch }}
      PAYLOAD_IMAGE: ghcr.io/otelx/rio/instrumentation:dev-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        delivery: [imageVolume, initContainer]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Install kind
        env:
          GOBIN: ${{ github.workspace }}/.artifacts/bin
        run: |
          mkdir -p .artifacts/tmp
          export TMPDIR="$PWD/.artifacts/tmp"
          go install sigs.k8s.io/kind@v0.33.0
          echo "$GOBIN" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: tested-release-images-${{ matrix.arch }}
          path: .artifacts/release
      - name: Load tested images
        run: gzip -dc .artifacts/release/release-images.tar.gz | docker load
      - name: Verify rollout, recovery, removal, and HTTP trace export
        env:
          CLUSTER_NAME: rio-ci-${{ matrix.arch }}-${{ matrix.delivery }}
          IMAGE_VOLUME_ENABLED: ${{ matrix.delivery == 'imageVolume' }}
          EXPECT_ARCHITECTURES: ${{ matrix.arch }}
          EXPECT_DELIVERY: ${{ matrix.delivery }}
        run: |
          export CLUSTER_NAME="${CLUSTER_NAME,,}"
          make e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: diagnostics-${{ matrix.arch }}-${{ matrix.delivery }}
          path: |
            .artifacts/e2e/**/*.log
            .artifacts/e2e/**/*.json
          include-hidden-files: true
          if-no-files-found: ignore

  platforms:
    name: Verify multi-platform image selection
    needs: integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      registry:
        image: registry:2@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
        ports: ['5000:5000']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: tested-release-images-*
          path: .artifacts/release
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Publish tested images to the disposable registry
        run: |
          for arch in amd64 arm64; do
            gzip -dc ".artifacts/release/tested-release-images-$arch/release-images.tar.gz" | docker load
          done
          scripts/publish-images.sh localhost:5000/rio-ci "$GITHUB_SHA"
      - name: Resolve and execute both architectures through common tags
        run: |
          for arch in amd64 arm64; do
            docker run --rm --pull always --platform "linux/$arch" "localhost:5000/rio-ci/rio/operator:$GITHUB_SHA" --help
            docker run --rm --pull always --platform "linux/$arch" "localhost:5000/rio-ci/rio/instrumentation:$GITHUB_SHA" /bin/sh -ec '
              /verify-layout.sh
              output=$(LD_PRELOAD=/dist/injector/libotelinject.so /bin/sh -c true 2>&1)
              test -z "$output"
            '
          done

  published-security:
    name: Scan supported release (${{ matrix.arch }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Scan latest published release, including prereleases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/install-security-tools.sh
          version=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName')
          [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-alpha\.[0-9]+)?$ ]]
          status=0
          for role in operator instrumentation; do
            image="ghcr.io/otelx/rio/$role:$version"
            docker pull --platform 'linux/${{ matrix.arch }}' "$image"
            scripts/scan-image.sh "$role" "$image" ".artifacts/security/$role" || status=1
          done
          exit "$status"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: security-published-${{ matrix.arch }}
          path: |
            .artifacts/security/**/*.json
            .artifacts/security/**/*.txt
          include-hidden-files: true
          retention-days: 30

  release:
    name: Publish validated alpha release
    if: startsWith(github.ref, 'refs/tags/') && github.event_name == 'push'
    needs: [quality, integration, platforms]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
      packages: write
      pull-requests: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify release source before registry authentication
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/check-release-source.sh
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: tested-release-images-*
          path: .artifacts/release
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Publish tested images and source
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/release.sh

name: Retire legacy image packages

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: retire-legacy-image-packages
  cancel-in-progress: false

jobs:
  retire:
    if: github.repository == 'otelx/rio' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify replacements and delete only retired packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.parse import quote, urlencode
          from urllib.request import Request, urlopen

          legacy = ('rio', 'rio-payload')
          replacements = ('rio/operator', 'rio/instrumentation')

          def api(path, method='GET'):
              request = Request('https://api.github.com' + path, method=method, headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
              })
              with urlopen(request) as response:
                  raw = response.read()
                  return json.loads(raw) if raw else None

          def package(name):
              try:
                  return api('/orgs/otelx/packages/container/' + quote(name, safe=''))
              except HTTPError as error:
                  if error.code == 404:
                      return None
                  raise

          def public_manifest(name):
              repository = 'otelx/' + name
              query = urlencode({'service': 'ghcr.io', 'scope': f'repository:{repository}:pull'})
              with urlopen('https://ghcr.io/token?' + query) as response:
                  token = json.load(response)['token']
              request = Request(f'https://ghcr.io/v2/{repository}/manifests/v0.1.0-alpha.3', headers={
                  'Authorization': 'Bearer ' + token,
                  'Accept': 'application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json',
              })
              with urlopen(request) as response:
                  manifest = json.load(response)
                  digest = response.headers['Docker-Content-Digest']
              platforms = sorted((m['platform']['os'], m['platform']['architecture']) for m in manifest['manifests']
                                 if m.get('annotations', {}).get('vnd.docker.reference.type') != 'attestation-manifest')
              assert platforms == [('linux', 'amd64'), ('linux', 'arm64')], platforms
              return digest

          # Check all four exact package identities and public replacements before deletion.
          inventory = {name: package(name) for name in legacy + replacements}
          for name, metadata in inventory.items():
              if metadata is None:
                  assert name in legacy, f'Missing replacement: {name}'
                  print(f'Already absent: {name}')
                  continue
              assert metadata['name'] == name, metadata['name']
              assert metadata['repository']['full_name'] == 'otelx/rio', metadata['repository']
              print(json.dumps({key: metadata.get(key) for key in ('name', 'visibility', 'version_count')}))
          for name in replacements:
              assert inventory[name]['visibility'] == 'public', name
          digests = {name: public_manifest(name) for name in replacements}

          for name in legacy:
              if inventory[name] is not None:
                  api('/orgs/otelx/packages/container/' + quote(name, safe=''), method='DELETE')
                  print(f'Deleted retired package: {name}')
          for name in legacy:
              assert package(name) is None, f'Retired package still exists: {name}'
          for name in replacements:
              assert package(name)['visibility'] == 'public', name
              assert public_manifest(name) == digests[name], f'Replacement digest changed: {name}'
          summary = ['Removed retired packages `otelx/rio` and `otelx/rio-payload`.', '',
                     'Verified both public replacement packages and unchanged alpha.3 multi-platform indexes:']
          summary.extend(f'- `ghcr.io/otelx/{name}@{digest}`' for name, digest in digests.items())
          Path(os.environ['GITHUB_STEP_SUMMARY']).write_text('\n'.join(summary) + '\n')
          print('Both retired packages are absent; both replacements remain public and unchanged.')
          PY
